name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.26.x', '1.27.x']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Check Docker daemon
        run: docker version
      - name: Pull integration image
        run: docker pull alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
      - name: Run Docker backend integration tests
        env:
          SANDBOX_DOCKER_INTEGRATION: '1'
        run: go test -race ./backend/docker -run 'TestDocker.*Integration' -count=1

  gvisor-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install pinned gVisor runtime
        run: bash .github/scripts/install-gvisor.sh
      - name: Run gVisor shared conformance suite
        env:
          SANDBOX_GVISOR_INTEGRATION: '1'
        run: go test -race ./backend/gvisor -run TestGVisorConformanceIntegration -count=1 -v

  landlock-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Show kernel
        run: uname -a
      - name: Probe Landlock
        run: go run ./experiments/landlock probe
      - name: Run standalone Landlock demo
        run: go run ./experiments/landlock demo
      - name: Run Landlock integration test
        env:
          SANDBOX_LANDLOCK_INTEGRATION: '1'
        run: go test -race ./experiments/landlock -run TestLandlockConfinementIntegration -count=1
